<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature - Komal Sharma</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0f2f5;
    padding: 20px;
    margin: 0;
}

.signature-table {
    background: linear-gradient(135deg, #ffffff 0%, #f9fbf7 100%);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    max-width: 580px;
    width: 100%;
    border-left: 6px solid #c5a059;
    border-collapse: separate;
    border-spacing: 0;
    margin: 0 auto;
    table-layout: fixed;
    overflow: hidden;
}

.info-cell {
    width: 76%;
    padding: 16px 14px 16px 20px;
    border-right: 1px solid #eaeaea;
    vertical-align: middle;
}

.logo-cell {
    width: 24%;
    padding: 12px 10px;
    text-align: center;
    vertical-align: middle;
}

.name {
    font-size: 20px;
    font-weight: 800;
    color: #1a237e;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.designation {
    font-size: 13px;
    color: #c5a059;
    font-weight: 700;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.subtitle {
    font-size: 12px;
    color: #616161;
    font-style: italic;
    margin: 2px 0 8px;
}

.contact-list {
    margin: 6px 0;
}

.contact-item {
    font-size: 13px;
    color: #333;
    text-decoration: none;
    display: inline-block;
    margin-right: 14px;
    margin-bottom: 4px;
    overflow-wrap: anywhere;
}

.contact-item i {
    color: #c5a059;
    width: 16px;
    margin-right: 2px;
}

.address {
    font-size: 11px;
    color: #666;
    line-height: 1.45;
    margin-top: 8px;
    border-top: 1px solid #eee;
    padding-top: 8px;
}

.address i {
    color: #c5a059;
    margin-right: 4px;
}

.social-links {
    margin-top: 8px;
}

.social-icon {
    display: inline-block;
    margin-right: 8px;
    text-decoration: none;
    vertical-align: middle;
}

.palace-logo {
    width: 75px;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 8px;
}

.rtdc-logo {
    width: 42px;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .signature-table {
        table-layout: auto;
    }

    .signature-table tr,
    .signature-table td {
        display: block;
        width: 100% !important;
    }

    .info-cell {
        padding: 16px;
        border-right: none;
        border-bottom: 1px solid #eee;
    }

    .logo-cell {
        padding: 12px 10px;
    }

    .name {
        font-size: 18px;
    }

    .contact-item {
        display: block;
        margin-right: 0;
        margin-bottom: 4px;
    }
}
</style>
</head>

<body>

<table class="signature-table" cellpadding="0" cellspacing="0" border="0">
<tr>

<td class="info-cell">
    <div class="name">KOMAL SHARMA</div>
    <div class="designation">SALES EXECUTIVE</div>
    <div class="subtitle">Palace on Wheels</div>

    <div class="contact-list">
        <a href="tel:+918233823111" class="contact-item">
            <i class="fas fa-phone"></i> +91 82338 23111
        </a>

        <a href="mailto:sales@powindia.com" class="contact-item">
            <i class="fas fa-envelope"></i> sales@powindia.com
        </a>

        <a href="https://www.palaceonwheels.rajasthan.gov.in" target="_blank" class="contact-item">
            <i class="fas fa-globe"></i> www.palaceonwheels.rajasthan.gov.in
        </a>
    </div>

    <div class="address">
        <i class="fas fa-map-marker-alt"></i> C-66, Near Airport Terminal - 2, Siddharth Nagar,<br>
        Govind Vihar, Jaipur, Rajasthan - 302018 (India)
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/heritagepalaceonwheel/" target="_blank" class="social-icon">
            <img src="https://cdn.simpleicons.org/facebook/1877F2" width="20" height="20" alt="Facebook">
        </a>

        <a href="https://www.instagram.com/heritagepalaceonwheels/" target="_blank" class="social-icon">
            <img src="https://cdn.simpleicons.org/instagram/E4405F" width="20" height="20" alt="Instagram">
        </a>

        <a href="https://www.youtube.com/@thepowindia" target="_blank" class="social-icon">
            <img src="https://cdn.simpleicons.org/youtube/FF0000" width="24" height="20" alt="YouTube">
        </a>
    </div>
</td>

<td width="160" align="center" class="content-cell" valign="middle">

    <img
        src="https://www.lohagarhfortresort.in/brochures/logo.jpg.jpeg"
        alt="Palace on Wheels"
        class="palace-logo">

    <img
        src="https://www.lohagarhfortresort.in/brochures/rtdc-logo.jpg.jpeg"
        alt="RTDC"
        class="rtdc-logo">

</td>

</tr>
</table>

</body>
</html>
